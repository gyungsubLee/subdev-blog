name: Deploy main
run-name: deploy:${{ github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Do not cancel an alias mutation halfway through. Pending runs are replaced by newer main pushes.
concurrency:
  group: blog-main-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'gyungsubLee/subdev-blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://subdev-blog-cms-gyungsublee.vercel.app
    env:
      GH_TOKEN: ${{ github.token }}
      BLOG_PRODUCTION_ALIAS: ${{ vars.BLOG_PRODUCTION_ALIAS }}
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Reject superseded or uncommitted source
        id: source
        run: node scripts/deploy-main.mjs preflight
      - name: Install dependencies
        if: steps.source.outputs.current == 'true'
        run: npm ci
      - name: Prepare project and build exact commit
        if: steps.source.outputs.current == 'true'
        env:
          # The Node function builder runs npm install after the pinned npm ci.
          npm_config_save: 'false'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node scripts/vercel-preview.mjs prepare
          npx --yes vercel@58.1.0 build --token="$VERCEL_TOKEN"
          git diff --exit-code -- package-lock.json
      - name: Check application and content
        if: steps.source.outputs.current == 'true'
        run: |
          npm run check
          npm run check:content
      - name: Record source status before upload
        if: steps.source.outputs.current == 'true'
        run: git status --short --untracked-files=all --ignore-submodules=all
      - name: Upload tested candidate without moving operating address
        if: steps.source.outputs.current == 'true'
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx --yes vercel@58.1.0 deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
            --meta "githubCommitSha=$GITHUB_SHA" --meta "githubActionsRunId=$GITHUB_RUN_ID" \
            --meta "githubActionsRunAttempt=$GITHUB_RUN_ATTEMPT" --meta githubCommitRef=main)"
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed commit and promote current main
        if: steps.source.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PREVIEW_URL: ${{ steps.candidate.outputs.url }}
        run: |
          git status --short --untracked-files=all --ignore-submodules=all
          node scripts/deploy-main.mjs promote
