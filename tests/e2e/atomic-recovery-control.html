<!doctype html>
<meta charset="utf-8">
<title>Accepted atomic request recovery</title>
<h1>Accepted atomic request recovery</h1>
<p>Reads the production durable queue and reconciles one already accepted request.</p>
<button id="recover">Reconcile accepted request</button>
<pre id="status">Ready.</pre>
<script type="module">
import {syncStore} from '/app/web/src/features/content-management/sync-store.mjs';
import {syncScope} from '/app/web/src/features/content-management/background-sync.mjs';
const status=document.querySelector('#status');
document.querySelector('#recover').onclick=async event=>{
  event.target.disabled=true;
  try {
    const session=await(await fetch('/api/session',{signal:AbortSignal.timeout(10000)})).json();
    if(session.state!=='ready')throw Error('Owner session is not ready');
    const queue=await syncStore.read(syncScope(session));
    const batch=queue.history.filter(item=>item.state==='confirmed'&&item.result?.sourceOnly).at(-1);
    if(!batch)throw Error('No accepted atomic request in this origin');
    const started=performance.now();
    const response=await fetch('/api/content?reconcile=1',{
      method:'POST',headers:{'Content-Type':'application/json','x-csrf-token':session.csrfToken,'X-Content-Reconcile':'1'},
      body:JSON.stringify(batch.payload),signal:AbortSignal.timeout(30000),
    });
    const result=await response.json();
    if(!response.ok)throw Error('HTTP '+response.status+': '+result.error);
    const evidence={event:'actual-recovery',requestId:batch.payload.requestId,
      expectedCommit:batch.result.contentCommit,actualCommit:result.contentCommit,
      sameCommit:result.contentCommit===batch.result.contentCommit,state:result.state,ms:performance.now()-started};
    status.textContent=JSON.stringify(evidence,null,2);
    await fetch('/__measure/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(evidence)});
  }catch(error){status.textContent=error.message;}
};
</script>
